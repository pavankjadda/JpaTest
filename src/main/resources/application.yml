### Logging config file
logging:
  level:
    org.hibernate.event.spi: DEBUG
    org.hibernate.event: INFO
server:
  port: 8081

### Spring Properties
spring:
  application:
    name: pres
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

    # SQL Server datasource Properties
    #    datasource:
    #      url: jdbc:mysql://localhost:33061/jpa_test
    #      username: root
    #      password: Test@2020
    #      driver-class-name: com.mysql.cj.jdbc.Driver
    #
    #  datasource:
    #    url: jdbc:postgresql://localhost:5432/jpa_test
    #    username: root
    #    password: Test@2020
    #driver-class-name: org.postgresql.Driver

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=jpa_test;encrypt=false
    username: sa
    password: Test@2020
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  # JPA properties
  jpa:
    generate-ddl: true
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        ddl-auto: none
        show_sql: false
        format_sql: false
        order_inserts: true
        order_updates: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        envers:
          audit_strategy: org.hibernate.envers.strategy.ValidityAuditStrategy
          global_with_modified_flag: true


  # Spring Session properties
  session:
    jdbc:
      table-name: SPRING_SESSION
      initialize-schema: always
    timeout: 1h
    store-type: jdbc
