logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.SQL_SLOW: DEBUG
    org.hibernate.stat: DEBUG
    #org.hibernate.orm.jdbc.bind: DEBUG

server:
  port: 8081

### Spring Properties
spring:
  application:
    name: jps-test
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  # PRES SQL Server datasource Properties
  #  datasource:
  #    url: jdbc:mysql://localhost:33061/jpa_test
  #    username: root
  #    password: Test#12345
  #    driver-class-name: com.mysql.cj.jdbc.Driver

  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/jpa_test
  #    username: root
  #    password: Test@2020
  #    driver-class-name: org.postgresql.Driver

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=jpa_test;encrypt=false
    username: sa
    password: Test@2020
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # JPA properties
  jpa:
    generate-ddl: true
    open-in-view: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        ddl-auto: none
        show_sql: false
        format_sql: false
        order_inserts: true
        order_updates: true
        pretty_print: true
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        envers:
          audit_strategy: org.hibernate.envers.strategy.ValidityAuditStrategy
          global_with_modified_flag: true
        generate_statistics: false